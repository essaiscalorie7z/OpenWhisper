name: Open Whisper iOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le projet et les dépendances vérifiées
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
          bash scripts/prepare.sh
      - name: Tester sur iPhone simulé
        id: tests
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r,g in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if "iOS" in r for d in g if "iPhone" in d["name"]))')
          xcodebuild test -scheme OpenWhisper -configuration Debug -destination "id=$device" -derivedDataPath build -parallel-testing-enabled NO -resultBundlePath Tests.xcresult | tee tests.log
      - name: Compiler pour iPhone
        id: device
        if: success() || failure()
        run: |
          set -o pipefail
          xcodebuild build -scheme OpenWhisper -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee release.log
      - name: Vérifier et empaqueter
        id: package
        if: always() && steps.device.outcome == 'success'
        run: bash scripts/package.sh
      - name: Publier l’IPA vérifié
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWhisper-unsigned
          path: |
            dist/OpenWhisper-unsigned.ipa
            dist/SHA256.txt
          if-no-files-found: error
      - name: Rapport
        if: always()
        run: |
          cat > rapport.md <<REPORT
          # Open Whisper
          Commit $GITHUB_SHA
          * Tests XCTest sur simulateur (disposition, règles, transfert local, silence et audio français synthétique) — ${{ steps.tests.outcome }}
          * Compilation Release iphoneos — ${{ steps.device.outcome }}
          * Validation arm64, plateforme iOS, extension embarquée, structure IPA et CRC — ${{ steps.package.outcome }}
          * Parcours implémenté : capture dans l’app, inférence locale, transfert volontaire, insertion par le clavier actif.
          * À vérifier sur iPhone signé : permissions, App Group interprocessus, interruptions, insertion dans Notes/Messages, ergonomie, mémoire, chauffe et latence.
          * Le clavier ne capture pas le microphone. Les champs sécurisés et certains champs téléphoniques utilisent le clavier système.
          REPORT
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rapport-iOS
          path: |
            rapport.md
            Tests.xcresult
            release.log
            tests.log
