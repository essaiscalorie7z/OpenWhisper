name: OpenWhisper
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    OW_GROUP: group.fr.openwhisper.mobile
    GENERATE_INFOPLIST_FILE: YES
targets:
  OpenWhisper:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.openwhisper.mobile
        INFOPLIST_KEY_CFBundleDisplayName: Open Whisper
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Open Whisper utilise le microphone pendant votre dictée dans l’application.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Config/Group.entitlements
    dependencies:
      - target: Clavier
        embed: true
      - framework: vendor/build-apple/whisper.xcframework
        embed: true
  Clavier:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.openwhisper.mobile.clavier
        INFOPLIST_FILE: Config/Keyboard.plist
        CODE_SIGN_ENTITLEMENTS: Config/Group.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OpenWhisperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        buildPhase: resources
      - path: Keyboard/KeyboardController.swift
      - path: Shared/Shared.swift
    dependencies:
      - target: OpenWhisper
schemes:
  OpenWhisper:
    build:
      targets:
        OpenWhisper: all
    test:
      targets: [OpenWhisperTests]
